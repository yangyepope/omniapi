services:

  # Local services are available on their ports, but also available on:
  # http://api.localhost.tiangolo.com: backend
  # http://dashboard.localhost.tiangolo.com: frontend
  # etc. To enable it, update .env, set:
  # DOMAIN=localhost.tiangolo.com
  proxy:
    image: traefik:3.6
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8001:80"
      - "8002:8080"
    # Duplicate the command from compose.yml to add --api.insecure=true
    command:
      # Enable Docker in Traefik, so that it reads labels from Docker services
      - --providers.docker
      # Add a constraint to only use services with the label for this stack
      - --providers.docker.constraints=Label(`traefik.constraint-label`, `traefik-public`)
      # Do not expose all Docker services, only the ones explicitly exposed
      - --providers.docker.exposedbydefault=false
      # Create an entrypoint "http" listening on port 80
      - --entrypoints.http.address=:80
      # Create an entrypoint "https" listening on port 443
      - --entrypoints.https.address=:443
      # Enable the access log, with HTTP requests
      - --accesslog
      # Enable the Traefik log, for configurations and errors
      - --log
      # Enable debug logging for local development
      - --log.level=DEBUG
      # Enable the Dashboard and API
      - --api
      # Enable the Dashboard and API in insecure mode for local development
      - --api.insecure=true
    labels:
      # Enable Traefik for this service, to make it available in the public network
      - traefik.enable=true
      - traefik.constraint-label=traefik-public
      # Dummy https-redirect middleware that doesn't really redirect, only to
      # allow running it locally
      - traefik.http.middlewares.https-redirect.contenttype.autodetect=false
    networks:
      - traefik-public
      - default

  db:
    restart: "no"
    ports:
      - "5332:5432"

  prestart:
    volumes:
      - ./backend:/app/backend

  adminer:
    restart: "no"
    ports:
      - "8003:8080"

  backend:
    restart: "no"
    ports:
      - "8004:8000"
      - "5678:5678"  # 开放调试端口
    build:
      context: .
      dockerfile: backend/Dockerfile
    # command: sleep infinity  # Infinite loop to keep container alive doing nothing
    command: >
      bash -c "python3 -m venv /app/.venv --clear && 
      /app/.venv/bin/pip install 'urllib3<2.0' 'charset-normalizer<4' 'chardet<6' -i https://pypi.tuna.tsinghua.edu.cn/simple --default-timeout=100 &&
      /app/.venv/bin/pip install --upgrade pip -i https://pypi.tuna.tsinghua.edu.cn/simple --default-timeout=100 && 
      /app/.venv/bin/pip install debugpy sentry-sdk fastapi[all] uvicorn[standard] sqlalchemy sqlmodel pydantic-settings loguru httpx emails email-validator jinja2 pwdlib[argon2] python-jose[cryptography] PyJWT python-multipart alembic bcrypt psycopg[binary] requests python-dotenv starlette-core greenlet celery redis -i https://pypi.tuna.tsinghua.edu.cn/simple --default-timeout=100 && 
      /app/.venv/bin/pip uninstall -y typing && 
      /app/.venv/bin/python -m debugpy --listen 0.0.0.0:5678 -m uvicorn app.main:app --reload --host 0.0.0.0 --port 8000"
    develop:  
      watch:
        - path: ./backend
          action: sync
          target: /app/backend
          ignore:
            - ./backend/.venv
            - .venv
        - path: ./backend/pyproject.toml
          action: rebuild
    # TODO: remove once coverage is done locally
    volumes:
      - ./backend/htmlcov:/app/backend/htmlcov
      - ./backend:/app/backend           # 同步后端代码
    environment:
      SMTP_HOST: "mailcatcher"
      SMTP_PORT: "1025"
      SMTP_TLS: "false"
      EMAILS_FROM_EMAIL: "noreply@example.com"
      CELERY_BROKER_URL: "redis://redis:6379/0"
      CELERY_RESULT_BACKEND: "redis://redis:6379/0"
    depends_on:
      - redis

  mailcatcher:
    image: schickling/mailcatcher
    ports:
      - "1080:1080"
      - "1025:1025"

  redis:
    image: redis:7
    ports:
      - "6380:6379"

  celery-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    # Use the same pip install command to make sure it has the same dependencies as backend
    command: >
      bash -c "python3 -m venv /app/.venv --clear && 
      /app/.venv/bin/pip install 'urllib3<2.0' 'charset-normalizer<4' 'chardet<6' &&
      /app/.venv/bin/pip install --upgrade pip && 
      /app/.venv/bin/pip install debugpy sentry-sdk fastapi[all] uvicorn[standard] sqlalchemy sqlmodel pydantic-settings loguru httpx emails email-validator jinja2 pwdlib[argon2] python-jose[cryptography] PyJWT python-multipart alembic bcrypt psycopg[binary] requests python-dotenv starlette-core greenlet celery redis && 
      /app/.venv/bin/pip uninstall -y typing && 
      /app/.venv/bin/celery -A app.worker worker --loglevel=info"
    volumes:
      - ./backend:/app/backend
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - POSTGRES_SERVER=db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - PROJECT_NAME=${PROJECT_NAME}
      - FIRST_SUPERUSER=${FIRST_SUPERUSER}
      - FIRST_SUPERUSER_PASSWORD=${FIRST_SUPERUSER_PASSWORD}
      - DOMAIN=${DOMAIN}
      - SECRET_KEY=${SECRET_KEY}
    depends_on:
      - redis
      - db

  frontend:
    restart: "no"
    ports:
      - "5173:80"
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        - VITE_API_URL=http://localhost:8004
        - NODE_ENV=development

  playwright:
    build:
      context: .
      dockerfile: frontend/Dockerfile.playwright
      args:
        - VITE_API_URL=http://backend:8000
        - NODE_ENV=production
    ipc: host
    depends_on:
      - backend
      - mailcatcher
    env_file:
      - .env
    environment:
      - VITE_API_URL=http://backend:8000
      - MAILCATCHER_HOST=http://mailcatcher:1080
      # For the reports when run locally
      - PLAYWRIGHT_HTML_HOST=0.0.0.0
      - CI=${CI}
    volumes:
      - ./frontend/blob-report:/app/frontend/blob-report
      - ./frontend/test-results:/app/frontend/test-results
    ports:
      - 9323:9323

networks:
  traefik-public:
    # For local dev, don't expect an external Traefik network
    external: false
